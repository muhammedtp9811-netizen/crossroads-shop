[build]
publish = "."
functions = "netlify/functions"

[functions]
node_bundler = "esbuild"

[[headers]]
for = "/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/*.css"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-store"

[[headers]]
for = "/build.json"
[headers.values]
Cache-Control = "no-store"
